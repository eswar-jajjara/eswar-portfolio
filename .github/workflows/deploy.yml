name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  build-frontend:
    needs: deploy-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          PORTFOLIO_SNAPSHOT: required
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  validate-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package Spring Boot API
        run: mvn -B package

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

  deploy-api:
    needs: [validate-api, validate-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
    steps:
      - name: Sync runtime secrets to Render
        shell: bash
        run: |
          set -euo pipefail
          for key in RENDER_API_KEY RENDER_SERVICE_ID DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD JWT_SECRET ADMIN_USERNAME ADMIN_PASSWORD_HASH CORS_ALLOWED_ORIGINS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done
          update_variable() {
            local key="$1"
            local value="$2"
            curl --fail --silent --show-error --output /dev/null --request PUT \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -nc --arg value "$value" '{value: $value}')"
          }
          update_variable DATABASE_URL "$DATABASE_URL"
          update_variable DATABASE_USERNAME "$DATABASE_USERNAME"
          update_variable DATABASE_PASSWORD "$DATABASE_PASSWORD"
          update_variable JWT_SECRET "$JWT_SECRET"
          update_variable ADMIN_USERNAME "$ADMIN_USERNAME"
          update_variable ADMIN_PASSWORD_HASH "$ADMIN_PASSWORD_HASH"
          update_variable CORS_ALLOWED_ORIGINS "$CORS_ALLOWED_ORIGINS"
      - name: Trigger and verify Render deployment
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg commit "$GITHUB_SHA" '{clearCache: "do_not_clear", commitId: $commit}')"
          response="$(curl --fail --silent --show-error --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          deploy_id="$(jq -r '.id // empty' <<< "$response")"
          test -n "$deploy_id"

          echo "Waiting for Render deploy ${deploy_id}..."
          for attempt in {1..90}; do
            deploy="$(curl --fail --silent --show-error \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}")"
            status="$(jq -r '.status // empty' <<< "$deploy")"
            echo "Render status: ${status:-unknown}"
            if [[ "$status" == "live" ]]; then
              exit 0
            fi
            if [[ "$status" == *failed* || "$status" == *canceled* || "$status" == *deactivated* ]]; then
              echo "Render deploy did not succeed."
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for the Render deploy."
          exit 1
